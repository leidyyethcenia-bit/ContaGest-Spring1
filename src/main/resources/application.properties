# ===== Configuracion general =====
spring.application.name=contagest-spring
# Puerto del servidor (se puede cambiar con la variable de entorno PORT)
server.port=${PORT:8080}

# ===== Base de datos H2 en modo archivo (los datos se conservan al reiniciar) =====
spring.datasource.url=jdbc:h2:file:./data/contagest-spring
spring.datasource.username=sa
spring.datasource.password=

# ===== JPA / Hibernate =====
# update: crea o ajusta las tablas automaticamente a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ===== Consola web de H2 (para ver la base de datos en http://localhost:8080/h2-console) =====
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===== Plantillas Thymeleaf =====
spring.thymeleaf.cache=false
